<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지자체 신청 판정 현황</title>
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#4b5768;
    --paper:#eef1f4;
    --panel:#ffffff;
    --line:#d7dce2;
    --navy:#22344d;
    --navy-deep:#16233a;
    --approve:#1f7a5c;
    --approve-bg:#e4f4ec;
    --reject:#a6402f;
    --reject-bg:#faeae7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{ max-width:980px; margin:0 auto; }

  .ledger-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px solid var(--navy);
    padding-bottom:16px;
    margin-bottom:24px;
    gap:12px;
    flex-wrap:wrap;
  }
  .ledger-head .eyebrow{
    font-size:12px;
    letter-spacing:0.3em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .ledger-head h1{
    margin:0;
    font-size:26px;
    letter-spacing:-0.01em;
    color:var(--navy-deep);
  }
  .ledger-head .meta{
    text-align:right;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  .rule-note{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--navy);
    padding:12px 16px;
    border-radius:2px;
    margin-bottom:28px;
    line-height:1.6;
  }
  .rule-note b{color:var(--navy-deep);}

  /* 요약 카드: 큼직하게 */
  .summary-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:32px;
  }
  .summary-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 18px;
    position:relative;
    overflow:hidden;
  }
  .summary-card::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
  }
  .summary-card.approve::before{background:var(--approve);}
  .summary-card.reject::before{background:var(--reject);}
  .summary-card.total::before{background:var(--navy);}
  .summary-card .label{
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin-bottom:10px;
    font-weight:600;
  }
  .summary-card .value{
    font-size:32px;
    font-weight:800;
    color:var(--navy-deep);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
    word-break:break-word;
  }
  .summary-card .unit{
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    margin-left:4px;
  }

  .table-scroll{
    width:100%;
    overflow-x:auto;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    -webkit-overflow-scrolling:touch;
  }
  table{
    width:100%;
    min-width:560px;
    border-collapse:collapse;
  }
  thead th{
    background:var(--navy-deep);
    color:#fff;
    font-size:12.5px;
    letter-spacing:0.04em;
    text-align:right;
    padding:12px 16px;
    font-weight:600;
    white-space:nowrap;
  }
  thead th:first-child{text-align:left;}
  tbody td{
    padding:11px 16px;
    text-align:right;
    border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--ink);
    white-space:nowrap;
  }
  tbody td:first-child{
    text-align:left;
    font-weight:600;
    color:var(--navy-deep);
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#f6f8fa;}

  .badge{
    display:inline-block;
    min-width:52px;
    padding:4px 10px;
    border-radius:3px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.03em;
    border:1px solid transparent;
  }
  .badge.approve{
    background:var(--approve-bg);
    color:var(--approve);
    border-color:#bfe3d3;
  }
  .badge.reject{
    background:var(--reject-bg);
    color:var(--reject);
    border-color:#eec6bd;
  }

  .footnote{
    margin-top:14px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .footnote.hint{
    text-align:left;
    margin-top:6px;
  }

  /* 모바일 반응형 */
  @media (max-width: 640px){
    body{ padding:20px 14px 48px; }
    .ledger-head{ flex-direction:column; align-items:flex-start; }
    .ledger-head .meta{ text-align:left; }
    .ledger-head h1{ font-size:22px; }
    .summary-row{
      grid-template-columns:1fr;
      gap:10px;
      margin-bottom:24px;
    }
    .summary-card .value{ font-size:28px; }
    thead th, tbody td{ padding:10px 12px; font-size:13px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="ledger-head">
    <div>
      <div class="eyebrow">지자체 지원금 신청 심사</div>
      <h1>신청 목록 판정 현황</h1>
    </div>
    <div class="meta" id="meta-count">총 - 건 접수</div>
  </div>

  <div class="rule-note">
    판정 규칙 &mdash; <b>한도액 = 인구수 × 10</b>. 신청액이 한도액보다 <b>크면 반려</b>, <b>작거나 같으면 승인</b>.
  </div>

  <div class="summary-row" id="summary-row"></div>

  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>지자체명</th>
          <th>인구수</th>
          <th>신청액</th>
          <th>한도액</th>
          <th style="text-align:center;">판정</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="footnote">단위: 원 · 인구수 단위: 명</div>
</div>

<script>
// 신청목록.json 원본 데이터 (동일 폴더의 파일 fetch 실패 시를 대비해 내장)
const EMBEDDED_DATA = [
  { "지자체명": "가람군", "인구수": 30000, "신청액": 250000 },
  { "지자체명": "나봄시", "인구수": 45000, "신청액": 500000 },
  { "지자체명": "다솔구", "인구수": 80000, "신청액": 600000 },
  { "지자체명": "라윤시", "인구수": 60000, "신청액": 700000 },
  { "지자체명": "마을군", "인구수": 25000, "신청액": 200000 },
  { "지자체명": "바람시", "인구수": 100000, "신청액": 950000 },
  { "지자체명": "사계구", "인구수": 55000, "신청액": 600000 },
  { "지자체명": "아현시", "인구수": 70000, "신청액": 650000 },
  { "지자체명": "자연군", "인구수": 40000, "신청액": 380000 },
  { "지자체명": "차돌시", "인구수": 90000, "신청액": 880000 }
];

const fmt = n => n.toLocaleString('ko-KR');

function render(raw) {
  const data = raw.map(row => {
    const 한도액 = row["인구수"] * 10;
    const 승인여부 = row["신청액"] > 한도액 ? "반려" : "승인";
    return { ...row, 한도액, 승인여부 };
  });

  document.getElementById('meta-count').textContent = `총 ${data.length}건 접수`;

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = data.map(row => `
    <tr>
      <td>${row["지자체명"]}</td>
      <td>${fmt(row["인구수"])}</td>
      <td>${fmt(row["신청액"])}</td>
      <td>${fmt(row["한도액"])}</td>
      <td style="text-align:center;">
        <span class="badge ${row["승인여부"] === '승인' ? 'approve' : 'reject'}">${row["승인여부"]}</span>
      </td>
    </tr>
  `).join('');

  const approveCount = data.filter(r => r["승인여부"] === '승인').length;
  const rejectCount = data.length - approveCount;
  const approveSum = data.filter(r => r["승인여부"] === '승인').reduce((s, r) => s + r["신청액"], 0);

  document.getElementById('summary-row').innerHTML = `
    <div class="summary-card approve">
      <div class="label">승인 건수</div>
      <div class="value">${approveCount}<span class="unit">건</span></div>
    </div>
    <div class="summary-card reject">
      <div class="label">반려 건수</div>
      <div class="value">${rejectCount}<span class="unit">건</span></div>
    </div>
    <div class="summary-card total">
      <div class="label">승인 신청액 합계</div>
      <div class="value">${fmt(approveSum)}<span class="unit">원</span></div>
    </div>
  `;
}

// 같은 폴더의 신청목록.json을 fetch 시도, 실패하면 내장 데이터 사용
// (file:// 로 직접 열 경우 브라우저 보안 정책상 fetch가 차단될 수 있어 fallback 처리)
fetch('신청목록.json')
  .then(res => {
    if (!res.ok) throw new Error('fetch failed');
    return res.json();
  })
  .then(json => render(json))
  .catch(() => render(EMBEDDED_DATA));
</script>
</body>
</html>
